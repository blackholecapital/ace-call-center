name = "ace-voice-worker"
main = "src/index.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[vars]
TENANT_ID = "ace-host"
CORPORATE_ID = "ace-host"
DEFAULT_LOCATION_ID = "corporate"
TENANT_MODE = "corporate-franchise"
TENANT_PROFILE = "data-center"
BRAND_NAME = "ACE Host"
ASSISTANT_NAME = "Alley"
CONCIERGE_PUBLIC_URL = "https://ace-concierge-worker.cryptocapitalgroupfl.workers.dev"
PUBLIC_BASE_URL = "https://ace-voice-worker.cryptocapitalgroupfl.workers.dev"
MEDIA_STREAM_URL = "wss://ace-voice-worker.cryptocapitalgroupfl.workers.dev/twilio/media"
DEEPGRAM_STT_MODEL = "nova-3"
DEEPGRAM_ENDPOINTING_MS = "300"
DEEPGRAM_UTTERANCE_END_MS = "1000"
DEEPGRAM_FINAL_GRACE_MS = "900"
DEEPGRAM_TERMINAL_GRACE_MS = "350"
DEEPGRAM_NO_DELAY = "true"
BARGE_IN_MIN_WORDS = "2"
BARGE_IN_FINAL_MIN_CONFIDENCE = "0.78"
BARGE_IN_INTERIM_MIN_CONFIDENCE = "0.88"
BUDDY_RUNTIME_URL = "https://erkn5tqy74wqqi-8000.proxy.runpod.net"
EILA_RUNTIME_URL = "https://erkn5tqy74wqqi-8100.proxy.runpod.net"
EILA_RUNTIME_STREAMING = "true"
EILA_FIRST_AUDIO_TIMEOUT_MS = "8000"
EILA_TOTAL_TIMEOUT_MS = "30000"
BUDDY_OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
BUDDY_OPENAI_TTS_VOICE = "shimmer"
BUDDY_OPENAI_TTS_SPEED = "0.98"
BUDDY_OPENAI_TTS_INSTRUCTIONS = "Speak as Alley, a warm, confident British woman representing ACE Host. Use a consistent contemporary Southern British English accent, with natural British vowels and rhythm. Keep the voice distinctly feminine. Speak at a natural conversational pace with brief pauses between thoughts. Sound like a relaxed consultative salesperson on a real phone call—welcoming, polished, responsive, and never like an announcer or phone menu."

[observability]
enabled = true

[observability.logs]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[queues.producers]]
binding = "EVENTS"
queue = "ace-communication-events"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ace_voice_events"

[[services]]
binding = "CONCIERGE"
service = "ace-concierge-worker"
