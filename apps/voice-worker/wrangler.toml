name = "blackhole-voice-worker"
main = "src/index.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_BASE_URL = "https://blackhole-voice-worker.cryptocapitalgroupfl.workers.dev"
MEDIA_STREAM_URL = "wss://blackhole-voice-worker.cryptocapitalgroupfl.workers.dev/twilio/media"
DEEPGRAM_STT_MODEL = "nova-3"
DEEPGRAM_ENDPOINTING_MS = "300"
BUDDY_RUNTIME_URL = "https://erkn5tqy74wqqi-8000.proxy.runpod.net"
BUDDY_OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
BUDDY_OPENAI_TTS_VOICE = "cedar"
BUDDY_OPENAI_TTS_SPEED = "1.0"

[[services]]
binding = "CONCIERGE"
service = "blackhole-concierge-worker"

[observability]
enabled = true

[observability.logs]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[queues.producers]]
binding = "EVENTS"
queue = "blackhole-communication-events"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "blackhole_voice_events"
