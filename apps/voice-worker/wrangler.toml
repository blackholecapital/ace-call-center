name = "ace-voice-worker"
main = "src/index.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[vars]
TENANT_ID = "ace-host"
CORPORATE_ID = "ace-host"
DEFAULT_LOCATION_ID = "corporate"
TENANT_MODE = "corporate-franchise"
TENANT_PROFILE = "data-center"
BRAND_NAME = "ACE Host"
ASSISTANT_NAME = "Alley"
CONCIERGE_PUBLIC_URL = "https://ace-concierge-worker.cryptocapitalgroupfl.workers.dev"
PUBLIC_BASE_URL = "https://ace-voice-worker.cryptocapitalgroupfl.workers.dev"
MEDIA_STREAM_URL = "wss://ace-voice-worker.cryptocapitalgroupfl.workers.dev/twilio/media"
DEEPGRAM_STT_MODEL = "nova-3"
DEEPGRAM_ENDPOINTING_MS = "300"
BUDDY_RUNTIME_URL = "https://erkn5tqy74wqqi-8000.proxy.runpod.net"
BUDDY_OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
BUDDY_OPENAI_TTS_VOICE = "marin"
BUDDY_OPENAI_TTS_SPEED = "1.0"
BUDDY_OPENAI_TTS_INSTRUCTIONS = "Speak as Alley, a warm, confident British woman representing ACE Host. Use a clearly recognizable contemporary Southern British English accent throughout every sentence, never an American accent. Sound like a natural consultative salesperson on a real phone call: relaxed, polished, responsive, and conversational, with gentle pacing, clear phrasing, subtle pauses, and no announcer cadence."

[observability]
enabled = true

[observability.logs]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[queues.producers]]
binding = "EVENTS"
queue = "ace-communication-events"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ace_voice_events"
