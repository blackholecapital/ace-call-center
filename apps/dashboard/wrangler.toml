# ACE Host Cloudflare Module Worker configuration.
# A plain `wrangler deploy` from this repository targets ACE-only resources.

name = "ace-dashboard-worker"
main = "worker-entry.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
APP_VERSION = "ace-corporate-v1"
NODE_ENV = "production"
LOG_LEVEL = "info"
LOG_FORMAT = "json"
DB_BACKEND = "d1"
RUNTIME_TARGET = "edge"
TENANT_ID = "ace-host"
CORPORATE_ID = "ace-host"
DEFAULT_LOCATION_ID = "corporate"
TENANT_MODE = "corporate-franchise"
TENANT_PROFILE = "data-center"
BRAND_NAME = "ACE Host"
ASSISTANT_NAME = "Alley"
DASHBOARD_PUBLIC_URL = "https://ace-dashboard-worker.cryptocapitalgroupfl.workers.dev"
LIVEKIT_URL = "wss://eila-7257eve9.livekit.cloud"
LIVEKIT_MEETING_AGENT_NAME = "lemonslice"
LIVE_VIDEO_BOT_NAME = "EILA · ACE Host"
ZOOM_USER_ID = "me"

[[d1_databases]]
binding = "DB"
database_name = "ace-call-center-dashboard"
database_id = "d59697f5-0dbe-40db-850f-b1a1a456cb3e"

[[d1_databases]]
binding = "BUDDY_DB"
database_name = "ace-call-center-events"
database_id = "a8e336d2-da11-483a-b79f-3e39a2783c8c"

[[r2_buckets]]
binding = "TENANT_ARCHIVE"
bucket_name = "ace-call-center-archive"

[[queues.producers]]
binding = "FOLLOWUP_QUEUE"
queue = "ace-followup-jobs"

[[queues.consumers]]
queue = "ace-followup-jobs"
max_batch_size = 20
max_retries = 3
dead_letter_queue = "ace-followup-jobs-dlq"

[[queues.consumers]]
queue = "ace-communication-events"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "ace-communication-events-dlq"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ace_dashboard_events"

[[services]]
binding = "CONCIERGE"
service = "ace-concierge-worker"
